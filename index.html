<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-secondary/40 backdrop-blur-md border-b border-primary/20 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-heading font-bold text-primary tracking-wide">curatedbycabbit<span class="text-accent">.</span></h1>
            <button id="adminBtn" class="bg-primary hover:bg-primary/80 text-textLight px-5 py-2.5 rounded-lg font-semibold transition flex items-center gap-2 shadow-lg shadow-primary/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8">
        
        <!-- Admin Panel (Tersembunyi secara default) -->
        <div id="adminPanel" class="hidden mb-12 bg-cardBg border border-primary/30 rounded-xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6 border-b border-primary/20 pb-4">
                <h2 class="text-xl font-heading font-bold text-textLight">Panel Admin</h2>
                <button id="logoutBtn" class="text-accent hover:text-accent/80 font-semibold text-sm flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" /></svg>
                    Keluar
                </button>
            </div>
            
            <!-- Form Tambah/Edit Produk -->
            <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
                <input type="hidden" id="productId">
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold mb-1.5 text-primary">Judul Produk</label>
                    <input type="text" id="productTitle" required class="w-full bg-bgDark border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold mb-1.5 text-primary">Deskripsi Produk</label>
                    <textarea id="productDesc" required rows="3" class="w-full bg-bgDark border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1.5 text-primary">URL Gambar</label>
                    <input type="url" id="productImage" required class="w-full bg-bgDark border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition" placeholder="https://contoh.com/gambar.jpg">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1.5 text-primary">Link Afiliasi Shopee</label>
                    <input type="url" id="productLink" required class="w-full bg-bgDark border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition" placeholder="https://shopee.co.id/...">
                </div>
                <div class="md:col-span-2 flex gap-3 mt-2">

            <!-- Daftar Produk untuk Admin -->
           <!-- Ubah Kredensial Admin -->
<details class="mb-8 bg-bgDark border border-primary/30 rounded-xl overflow-hidden group">
    <summary class="cursor-pointer p-5 font-heading font-semibold text-textLight flex items-center justify-between hover:bg-primary/10 transition">
        <span class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
            </svg>
            Ubah Kredensial Admin
        </span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform group-open:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
    </summary>
    <div class="p-5 pt-0">

            Untuk keamanan, masukkan kata sandi Anda saat ini sebelum melakukan perubahan. Kosongkan kolom yang tidak ingin diubah.
        </p>
        <form id="credentialForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1.5 text-primary">Kata Sandi Saat Ini <span class="text-accent">*</span></label>
                <input type="password" id="currentPassword" required class="w-full bg-cardBg border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1.5 text-primary">Email Baru (opsional)</label>
                <input type="email" id="newEmail" class="w-full bg-cardBg border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition" placeholder="email.baru@contoh.com">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1.5 text-primary">Kata Sandi Baru (opsional)</label>
                    <input type="password" id="newPassword" class="w-full bg-cardBg border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition" placeholder="Minimal 6 karakter">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1.5 text-primary">Konfirmasi Kata Sandi Baru</label>
                    <input type="password" id="confirmPassword" class="w-full bg-cardBg border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                </div>
            </div>
            <p id="credentialMsg" class="text-sm hidden font-medium"></p>
            <button type="submit" id="credentialSubmitBtn" class="bg-primary hover:bg-primary/80 text-textLight font-bold py-3 px-6 rounded-lg transition shadow-lg shadow-primary/20">
                Simpan Perubahan
            </button>
        </form>
    </div>
</details>

        <!-- Grid Produk Publik -->
        <div id="publicProductGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Produk akan dimuat di sini -->
        </div>
        
        <!-- State Memuat -->
        <div id="loadingState" class="text-center py-16">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-primary border-t-transparent"></div>
            <p class="mt-3 text-textLight/70 font-medium">Memuat produk...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-secondary/40 border-t border-primary/20 py-8 mt-auto">
        <div class="container mx-auto px-4 text-center text-textLight/50 text-sm">
            <p>&copy; 2026 @curatedbycabbit. Semua hak dilindungi undang-undang.</p>
        </div>
    </footer>

    <!-- Modal Login -->
    <div id="loginModal" class="fixed inset-0 bg-bgDark/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardBg border border-primary/30 rounded-xl p-8 w-full max-w-md shadow-2xl relative">
            <button id="closeLoginModal" class="absolute top-4 right-4 text-textLight/50 hover:text-textLight">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h2 class="text-2xl font-heading font-bold text-textLight mb-6 text-center">Masuk sebagai Admin</h2>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-1.5 text-primary">Email</label>
                    <input type="email" id="loginEmail" required class="w-full bg-bgDark border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1.5 text-primary">Kata Sandi</label>
                    <input type="password" id="loginPassword" required class="w-full bg-bgDark border border-primary/30 rounded-lg px-4 py-3 text-textLight focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                </div>
                <p id="loginError" class="text-accent text-sm hidden text-center font-medium"></p>
                <button type="submit" class="w-full bg-primary hover:bg-primary/80 text-textLight font-bold py-3 rounded-lg transition shadow-lg shadow-primary/20">Masuk</button>
            </form>
        </div>
    </div>

    <script>
        // --- 1. KONFIGURASI FIREBASE ---
        // PENTING: Ganti dengan konfigurasi dari Firebase Console Anda
        const firebaseConfig = {
            apiKey: "AIzaSyCeX0xMhV9IFFDpaN5Lv4qyShSzVlxTJEA",
			authDomain: "curatedbycabbit.firebaseapp.com",
			databaseURL: "https://curatedbycabbit-default-rtdb.firebaseio.com",
			projectId: "curatedbycabbit",
			storageBucket: "curatedbycabbit.firebasestorage.app",
			messagingSenderId: "475274795268",
			appId: "1:475274795268:web:c8585cf73c02bea5f2d851",
			measurementId: "G-68BKJJGBXP"
        };

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- 2. MANAJEMEN STATE ---
        let currentUser = null;
        let products = [];
        let isEditing = false;

        // --- 3. REFERENSI DOM ---
        const adminBtn = document.getElementById('adminBtn');
        const adminBtnText = document.getElementById('adminBtnText');
        const adminPanel = document.getElementById('adminPanel');
        const logoutBtn = document.getElementById('logoutBtn');
        const productForm = document.getElementById('productForm');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const publicProductGrid = document.getElementById('publicProductGrid');
        const adminProductList = document.getElementById('adminProductList');
        const loadingState = document.getElementById('loadingState');
        const loginModal = document.getElementById('loginModal');
        const loginForm = document.getElementById('loginForm');
        const closeLoginModal = document.getElementById('closeLoginModal');
        const loginError = document.getElementById('loginError');

		// --- 4. AUTENTIKASI ---
		auth.onAuthStateChanged(user => {
			currentUser = user;
		if (user) {
			adminBtnText.textContent = 'Panel Admin';
			adminPanel.classList.remove('hidden');
        
        // FIX: Properly hide the modal
        loginModal.classList.add('hidden');
        loginModal.classList.remove('flex'); 
        
        // UX FIX: Auto-scroll to the top so the user can see the admin panel
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        renderAdminProducts();
		} else {
        adminBtnText.textContent = 'Masuk Admin';
        adminPanel.classList.add('hidden');
        resetForm();
			}
		});

		adminBtn.addEventListener('click', () => {
			if (currentUser) {
				adminPanel.classList.toggle('hidden');
				// If the panel is now visible, scroll to it
				if (!adminPanel.classList.contains('hidden')) {
					window.scrollTo({ top: 0, behavior: 'smooth' });
				}
			} else {
				// FIX: Properly show the modal by adding 'flex'
				loginModal.classList.remove('hidden');
				loginModal.classList.add('flex');
			}
		});

		closeLoginModal.addEventListener('click', () => {
			loginModal.classList.add('hidden');
			loginModal.classList.remove('flex'); // FIX: Remove flex when hiding
			loginError.classList.add('hidden');
			loginForm.reset();
		});

		loginForm.addEventListener('submit', async (e) => {
			e.preventDefault();
			const email = document.getElementById('loginEmail').value;
			const password = document.getElementById('loginPassword').value;
			try {
				await auth.signInWithEmailAndPassword(email, password);
				loginForm.reset();
				// The onAuthStateChanged listener above will handle showing the panel
			} catch (error) {
				loginError.textContent = "Email atau kata sandi salah. Silakan coba lagi.";
				loginError.classList.remove('hidden');
			}
		});

        // --- 5. OPERASI FIRESTORE ---
        function loadProducts() {
            db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                products = [];
                snapshot.forEach(doc => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                renderPublicProducts();
                if (currentUser) renderAdminProducts();
                loadingState.classList.add('hidden');
            }, error => {
                console.error("Error mengambil data: ", error);
                loadingState.innerHTML = '<p class="text-accent font-medium">Gagal memuat produk. Periksa konfigurasi Firebase.</p>';
            });
        }

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const title = document.getElementById('productTitle').value;
            const description = document.getElementById('productDesc').value;
            const imageUrl = document.getElementById('productImage').value;
            const affiliateLink = document.getElementById('productLink').value;
            const productId = document.getElementById('productId').value;

            const productData = {
                title,
                description,
                imageUrl,
                affiliateLink,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (isEditing && productId) {
                    await db.collection('products').doc(productId).update(productData);
                } else {
                    productData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('products').add(productData);
                }
                resetForm();
            } catch (error) {
                console.error("Error menyimpan: ", error);
                alert("Gagal menyimpan produk.");
            }
        });

        async function deleteProduct(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus produk ini secara permanen?')) return;
            try {
                await db.collection('products').doc(id).delete();
            } catch (error) {
                console.error("Error menghapus: ", error);
                alert("Gagal menghapus produk.");
            }
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('productId').value = product.id;
            document.getElementById('productTitle').value = product.title;
            document.getElementById('productDesc').value = product.description;
            document.getElementById('productImage').value = product.imageUrl;
            document.getElementById('productLink').value = product.affiliateLink;

            isEditing = true;
            cancelEditBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        cancelEditBtn.addEventListener('click', resetForm);

        function resetForm() {
            productForm.reset();
            document.getElementById('productId').value = '';
            isEditing = false;
            cancelEditBtn.classList.add('hidden');
        }

        // --- 6. RENDERING UI ---
        function renderPublicProducts() {
            publicProductGrid.innerHTML = '';
            if (products.length === 0) {
                publicProductGrid.innerHTML = '<p class="col-span-full text-center text-textLight/60 py-12 text-lg">Belum ada produk yang tersedia saat ini.</p>';
                return;
            }

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card bg-cardBg border border-primary/20 rounded-xl overflow-hidden flex flex-col h-full';
                card.innerHTML = `
                    <div class="relative aspect-square overflow-hidden bg-secondary/50 group">
                        <img src="${product.imageUrl}" alt="${product.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/400x400/053048/e2e0f5?text=Gambar+Tidak+Tersedia'">
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="text-lg font-heading font-bold text-textLight mb-2 line-clamp-2 leading-tight">${product.title}</h3>
                        <p class="text-textLight/70 text-sm mb-5 flex-grow line-clamp-3 leading-relaxed">${product.description}</p>
                        <a href="${product.affiliateLink}" target="_blank" rel="noopener noreferrer" 
                           class="mt-auto block w-full bg-accent hover:bg-accent/80 text-white text-center font-bold py-3.5 rounded-lg transition flex items-center justify-center gap-2 shadow-lg shadow-accent/20">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                            Beli di Shopee
                        </a>
                    </div>
                `;
                publicProductGrid.appendChild(card);
            });
        }

        function renderAdminProducts() {
            adminProductList.innerHTML = '';
            if (products.length === 0) {
                adminProductList.innerHTML = '<p class="text-textLight/60 text-center py-4">Belum ada produk yang ditambahkan.</p>';
                return;
            }

            products.forEach(product => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-4 bg-bgDark p-3 rounded-lg border border-primary/20 hover:border-primary/40 transition';
                item.innerHTML = `
                    <img src="${product.imageUrl}" class="w-16 h-16 object-cover rounded-md bg-secondary/50 flex-shrink-0" onerror="this.src='https://via.placeholder.com/64/053048/e2e0f5?text=No'">
                    <div class="flex-grow min-w-0">
                        <h4 class="font-semibold text-textLight truncate">${product.title}</h4>
                        <p class="text-xs text-textLight/50 truncate">${product.affiliateLink}</p>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        <button onclick="editProduct('${product.id}')" class="bg-primary/20 hover:bg-primary/40 text-primary p-2.5 rounded-lg transition" title="Edit">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                        </button>
                        <button onclick="deleteProduct('${product.id}')" class="bg-accent/20 hover:bg-accent/40 text-accent p-2.5 rounded-lg transition" title="Hapus">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                `;
                adminProductList.appendChild(item);
            });
        }

        // --- 7. INISIALISASI ---
        // --- 6.5 UBAH KREDENSIAL ADMIN ---
const credentialForm = document.getElementById('credentialForm');
const credentialMsg = document.getElementById('credentialMsg');
const credentialSubmitBtn = document.getElementById('credentialSubmitBtn');

function showCredentialMessage(text, isError = false) {
    credentialMsg.textContent = text;
    credentialMsg.classList.remove('hidden', 'text-accent', 'text-green-400');
    credentialMsg.classList.add(isError ? 'text-accent' : 'text-green-400');
}

credentialForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!currentUser) return;

    const currentPassword = document.getElementById('currentPassword').value;
    const newEmail = document.getElementById('newEmail').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Validasi: harus ada yang diubah
    if (!newEmail && !newPassword) {
        showCredentialMessage('Masukkan email baru atau kata sandi baru yang ingin diubah.', true);
        return;
    }

    // Validasi: konfirmasi password harus cocok
    if (newPassword && newPassword !== confirmPassword) {
        showCredentialMessage('Kata sandi baru dan konfirmasi tidak cocok.', true);
        return;
    }

    // Validasi: panjang password minimal
    if (newPassword && newPassword.length < 6) {
        showCredentialMessage('Kata sandi baru minimal 6 karakter.', true);
        return;
    }

    credentialSubmitBtn.disabled = true;
    credentialSubmitBtn.textContent = 'Memproses...';
    credentialMsg.classList.add('hidden');

    try {
        // LANGKAH 1: Re-autentikasi (wajib oleh Firebase untuk operasi sensitif)
        const credential = firebase.auth.EmailAuthProvider.credential(
            currentUser.email,
            currentPassword
        );
        await currentUser.reauthenticateWithCredential(credential);

        // LANGKAH 2: Ubah email jika diisi
        if (newEmail && newEmail !== currentUser.email) {
            await currentUser.updateEmail(newEmail);
        }

        // LANGKAH 3: Ubah password jika diisi
        if (newPassword) {
            await currentUser.updatePassword(newPassword);
        }

        showCredentialMessage('✓ Kredensial berhasil diperbarui!', false);
        credentialForm.reset();

        // Auto-hide pesan sukses setelah 4 detik
        setTimeout(() => {
            credentialMsg.classList.add('hidden');
        }, 4000);

    } catch (error) {
        console.error('Error mengubah kredensial:', error);
        let errorMsg = 'Gagal mengubah kredensial.';
        
        if (error.code === 'auth/wrong-password') {
            errorMsg = 'Kata sandi saat ini salah.';
        } else if (error.code === 'auth/invalid-email') {
            errorMsg = 'Format email baru tidak valid.';
        } else if (error.code === 'auth/email-already-in-use') {
            errorMsg = 'Email tersebut sudah digunakan oleh akun lain.';
        } else if (error.code === 'auth/requires-recent-login') {
            errorMsg = 'Sesi login sudah kedaluwarsa. Silakan keluar dan masuk kembali.';
        } else if (error.code === 'auth/weak-password') {
            errorMsg = 'Kata sandi terlalu lemah.';
        }
        
        showCredentialMessage(errorMsg, true);
    } finally {
        credentialSubmitBtn.disabled = false;
        credentialSubmitBtn.textContent = 'Simpan Perubahan';
    }
});
    </script>
</body>
</html>
