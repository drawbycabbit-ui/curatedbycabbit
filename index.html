<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curated by Cabbit</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Konfigurasi Tailwind untuk menggunakan palette warna kita -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0002',
                        light: '#e2e0f5',
                        primary: '#8e5cb2',
                        secondary: '#053048',
                        accent: '#c20003',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light text-dark flex flex-col min-h-screen">

    <!-- 1. HEADER: Logo, Search, dan Link Admin -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <!-- Logo -->
                <a href="index.html" class="text-3xl font-brand font-bold text-primary tracking-tight">
                    CURATEDBY<span class="text-secondary">CABBIT</span>
                </a>
                
                <!-- Search Bar -->
                <div class="w-full md:w-1/2 relative">
                    <input type="text" id="searchInput" placeholder="Cari produk, brand, atau kategori..." 
                           class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>

                <!-- Link ke Admin (Bisa disembunyikan atau diberi icon gear) -->
                <a href="admin.html" class="text-sm font-semibold text-secondary hover:text-primary transition flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Admin
                </a>
            </div>
        </div>
    </header>

    <!-- 2. HERO SECTION: Banner promosi sederhana -->
    <section class="bg-secondary text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-5xl font-brand font-bold mb-4">Rekomendasi Produk Pilihan</h1>
            <p class="text-lg opacity-90 max-w-2xl mx-auto">Suka barang-barang yang tidak biasa? Intip koleksi unik pilihan kami di sini! Yuk, temukan produk favoritmu sekarang!</p>
        </div>
    </section>

    <!-- 3. PRODUCT GRID: Tempat produk akan di-render oleh JavaScript -->
	<main class="container mx-auto px-4 py-8 flex-grow">
		
		<!-- FILTER BAR BARU -->
		<div class="bg-white rounded-xl shadow-sm p-4 mb-8 border border-gray-100">
			<div class="grid grid-cols-1 md:grid-cols-4 gap-4">
				
				<!-- Search Nama Produk (sudah ada, dipindah ke sini) -->
				<div class="relative">
					<input type="text" id="searchInput" placeholder="Cari nama produk..." 
						   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
					<svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
				</div>

				<!-- Filter Kategori/Brand -->
				<select id="filterCategory" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary bg-white">
					<option value="">Semua Kategori</option>
				</select>

				<!-- Filter Nama Toko -->
				<select id="filterStore" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary bg-white">
					<option value="">Semua Toko</option>
				</select>

				<!-- Filter Tags -->
				<select id="filterTag" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary bg-white">
					<option value="">Semua Tags</option>
				</select>
			</div>

			<!-- Tombol Reset Filter -->
			<div class="mt-3 flex justify-end">
				<button id="resetFilterBtn" class="text-sm text-accent hover:text-red-800 font-semibold flex items-center gap-1">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
					Reset Filter
				</button>
			</div>
		</div>

		<!-- Info jumlah produk hasil filter -->
		<div class="flex justify-between items-center mb-6">
			<h2 class="text-2xl font-brand font-bold text-secondary border-l-4 border-primary pl-3">Produk</h2>
			<p id="productCount" class="text-sm text-gray-500">Memuat...</p>
		</div>
		
		<div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
			<p class="col-span-full text-center text-gray-500">Memuat produk...</p>
		</div>
	</main>

    <!-- 4. FOOTER -->
    <footer class="bg-dark text-light py-8 mt-auto">
        <div class="container mx-auto px-4 text-center">
            <p class="font-brand text-xl font-bold mb-2">CURATEDBYCABBIT</p>
            <p class="text-sm opacity-70">&copy; 2026 All rights reserved. Website ini berisi link afiliasi.</p>
        </div>
    </footer>

    <!-- Import Logic JavaScript (tipe module agar bisa import firebase) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
